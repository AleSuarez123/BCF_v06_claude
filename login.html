<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BCF Viewer Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Login Page Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px;
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 700;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            margin: 0 0 8px 0;
        }

        .login-subtitle {
            font-size: 14px;
            color: #718096;
            margin: 0;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
        }

        .form-input {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-input::placeholder {
            color: #a0aec0;
        }

        .login-button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }

        .alert.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .alert-error {
            background: #fee;
            color: #c53030;
            border: 1px solid #fc8181;
        }

        .alert-success {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .alert-info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        .alert-warning {
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fcd34d;
        }

        .login-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 13px;
            color: #718096;
        }

        .domain-info {
            margin-top: 16px;
            padding: 12px;
            background: #f7fafc;
            border-radius: 8px;
            font-size: 13px;
            color: #4a5568;
        }

        .domain-info strong {
            color: #2d3748;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Checkbox personalizado */
        .form-check {
            margin-bottom: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #4a5568;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            display: none;
        }

        .checkbox-custom {
            width: 20px;
            height: 20px;
            border: 2px solid #cbd5e0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .checkbox-label input[type="checkbox"]:checked + .checkbox-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
        }

        .checkbox-label input[type="checkbox"]:checked + .checkbox-custom::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .checkbox-label:hover .checkbox-custom {
            border-color: #667eea;
        }

        /* Validación de email */
        .input-with-validation {
            position: relative;
        }

        .email-validation-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .email-validation-icon.valid {
            opacity: 1;
            color: #48bb78;
        }

        .email-validation-icon.invalid {
            opacity: 1;
            color: #f56565;
        }

        .email-suggestion {
            margin-top: 6px;
            font-size: 12px;
            color: #718096;
            min-height: 18px;
        }

        .email-suggestion.show {
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .domain-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #edf2f7;
            border-radius: 4px;
            font-weight: 600;
            color: #4a5568;
            margin-left: 4px;
        }

        .domain-badge.allowed {
            background: #c6f6d5;
            color: #22543d;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 32px 24px;
                margin: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">BCF</div>
            <h1 class="login-title">BCF Viewer Pro</h1>
            <p class="login-subtitle">Gestor de Incidencias BIM</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="name" class="form-label">Nombre completo</label>
                <input
                    type="text"
                    id="name"
                    class="form-input"
                    placeholder="Ej: Juan Pérez"
                    required
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Correo electrónico</label>
                <div class="input-with-validation">
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="tu.email@empresa.com"
                        required
                        autocomplete="email"
                    >
                    <span class="email-validation-icon" id="email-validation"></span>
                </div>
                <div id="email-suggestion" class="email-suggestion"></div>
            </div>

            <div class="form-check">
                <label class="checkbox-label">
                    <input type="checkbox" id="remember-me" checked>
                    <span class="checkbox-custom"></span>
                    Recordarme en este dispositivo (30 días)
                </label>
            </div>

            <button type="submit" id="login-button" class="login-button">
                Acceder
            </button>
        </form>

        <div class="login-footer">
            © 2026 BCF Viewer Pro - Todos los derechos reservados
        </div>
    </div>

    <script type="module">
        import { AuthMgr } from './js/auth-manager.js';

        const form = document.getElementById('login-form');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const rememberMeCheckbox = document.getElementById('remember-me');
        const loginButton = document.getElementById('login-button');
        const alertBox = document.getElementById('alert');
        const emailValidation = document.getElementById('email-validation');
        const emailSuggestion = document.getElementById('email-suggestion');

        const ALLOWED_DOMAINS = ['gocsa.es', 'proyeco.es'];

        // Verificar si ya está autenticado
        if (AuthMgr.isAuthenticated()) {
            window.location.href = '/index.html';
        }

        // Auto-completar último email usado
        const lastEmail = AuthMgr.getLastEmail();
        if (lastEmail) {
            emailInput.value = lastEmail;
            // Sugerir nombre basado en email
            const name = lastEmail.split('@')[0].split('.').map(word =>
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
            nameInput.placeholder = `Ej: ${name}`;
        }

        // Validación de email en tiempo real
        emailInput.addEventListener('input', (e) => {
            const email = e.target.value.trim();

            // Limpiar validación si está vacío
            if (!email) {
                emailValidation.className = 'email-validation-icon';
                emailSuggestion.textContent = '';
                emailSuggestion.classList.remove('show');
                return;
            }

            // Validar formato de email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailRegex.test(email)) {
                const domain = email.split('@')[1]?.toLowerCase();

                if (ALLOWED_DOMAINS.includes(domain)) {
                    emailValidation.className = 'email-validation-icon valid';
                    emailValidation.textContent = '✓';
                    emailSuggestion.innerHTML = `✅ Dominio <span class="domain-badge allowed">@${domain}</span> permitido - acceso inmediato`;
                    emailSuggestion.classList.add('show');
                } else {
                    emailValidation.className = 'email-validation-icon valid';
                    emailValidation.textContent = '✓';
                    emailSuggestion.innerHTML = `⏳ Dominio <span class="domain-badge">@${domain}</span> requiere aprobación`;
                    emailSuggestion.classList.add('show');
                }
            } else {
                emailValidation.className = 'email-validation-icon invalid';
                emailValidation.textContent = '✗';
                emailSuggestion.textContent = '';
                emailSuggestion.classList.remove('show');
            }
        });

        // Sugerencias de dominio al escribir
        emailInput.addEventListener('keyup', (e) => {
            const email = e.target.value;

            // Si el usuario escribe @ pero no ha completado el dominio
            if (email.includes('@') && !email.split('@')[1]) {
                const commonDomains = ['gocsa.es', 'proyeco.es', 'gmail.com', 'hotmail.com'];
                emailSuggestion.innerHTML = `💡 Sugerencias: ${commonDomains.map(d =>
                    `<span class="domain-badge ${ALLOWED_DOMAINS.includes(d) ? 'allowed' : ''}">@${d}</span>`
                ).join(' ')}`;
                emailSuggestion.classList.add('show');
            }
        });

        function showAlert(message, type = 'info') {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;
        }

        function hideAlert() {
            alertBox.classList.remove('show');
        }

        function setLoading(loading) {
            if (loading) {
                loginButton.disabled = true;
                loginButton.innerHTML = '<span class="spinner"></span>Accediendo...';
            } else {
                loginButton.disabled = false;
                loginButton.innerHTML = 'Acceder';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const rememberMe = rememberMeCheckbox.checked;

            if (!name || !email) {
                showAlert('Por favor, completa todos los campos', 'error');
                return;
            }

            setLoading(true);

            try {
                const result = await AuthMgr.login(name, email, rememberMe);

                if (result.success) {
                    showAlert(result.message, 'success');

                    // Redirigir después de 1 segundo
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1000);
                } else {
                    if (result.action === 'request_created') {
                        showAlert(result.message, 'warning');
                    } else {
                        showAlert(result.message, 'error');
                    }
                    setLoading(false);
                }
            } catch (error) {
                console.error('Error en login:', error);
                showAlert('Error inesperado. Por favor, inténtalo de nuevo.', 'error');
                setLoading(false);
            }
        });

        // Auto-focus en el primer campo
        nameInput.focus();
    </script>
</body>
</html>
