<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componente Personalizar Columnas</title>
    <style>
        /* =========================================
           1. VARIABLES Y TEMA (Simulación de entorno)
           ========================================= */
        :root {
            --bg-background: #f8f9fa;
            --bg-card: #ffffff;
            --bg-hover: #f1f3f5;
            --text-primary: #212529;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --danger-color: #dc3545;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --border-radius-sm: 0.25rem;
            --border-radius-lg: 0.5rem;
            --transition-speed: 0.2s;
            --font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-background);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding-top: 50px;
            margin: 0;
        }

        /* =========================================
           2. ESTILOS DEL BOTÓN (Solicitado)
           ========================================= */
        .view-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition-speed) ease;
            box-shadow: var(--shadow-sm);
            user-select: none;
        }

        /* Estados Hover/Active/Focus */
        .view-btn:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background-color: var(--bg-hover);
        }

        .view-btn:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        .view-btn:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        /* Icono dentro del botón */
        .view-btn svg {
            width: 16px;
            height: 16px;
            stroke-width: 2;
        }

        /* =========================================
           3. ESTILOS DEL MODAL Y PANEL
           ========================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .column-customizer-panel {
            background: var(--bg-card);
            width: 400px;
            max-width: 90vw;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            max-height: 80vh;
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .modal-overlay.active .column-customizer-panel {
            transform: translateY(0);
        }

        /* Cabecera del Modal */
        .column-customizer-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-customizer-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .btn-close-customizer {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 20px;
            padding: 4px;
            line-height: 1;
            border-radius: 4px;
        }

        .btn-close-customizer:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        /* Cuerpo del Modal */
        .column-customizer-body {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
        }

        .text-sm { font-size: 12px; }
        .text-muted { color: var(--text-muted); }
        .mb-3 { margin-bottom: 12px; }

        /* Lista de Columnas (Drag & Drop) */
        .column-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .column-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            transition: all 0.2s ease;
            cursor: grab;
        }

        .column-item:hover {
            border-color: var(--primary-color);
        }

        .column-item.dragging {
            opacity: 0.5;
            background: var(--bg-hover);
            cursor: grabbing;
        }

        .column-item.active {
            background-color: #f0f7ff; /* Ligero tinte azul para activos */
            border-color: #cce5ff;
        }

        /* Elementos dentro del item */
        .column-item-drag-handle {
            margin-right: 12px;
            color: var(--text-muted);
            cursor: grab;
            display: flex;
            align-items: center;
        }

        .column-item-icon {
            margin: 0 12px;
            display: flex;
            align-items: center;
            color: var(--text-muted);
        }

        .column-item-label {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }

        /* Checkbox personalizado */
        .checkbox-wrapper {
            position: relative;
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
        }

        .checkbox-wrapper input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 18px;
            width: 18px;
            background-color: #eee;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .checkbox-wrapper:hover input ~ .checkmark {
            background-color: #ccc;
        }

        .checkbox-wrapper input:checked ~ .checkmark {
            background-color: var(--primary-color);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .checkbox-wrapper input:checked ~ .checkmark:after {
            display: block;
        }

        .checkbox-wrapper .checkmark:after {
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Pie del Modal */
        .column-customizer-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: var(--bg-background);
        }

        .btn {
            padding: 6px 16px;
            border-radius: var(--border-radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
        }
        .btn-ghost:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .column-customizer-panel {
                width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <!-- 
        4. BOTÓN DE ACTIVACIÓN 
        Accesible con aria-label y title
    -->
    <button id="btn-open-customizer" class="view-btn" aria-label="Personalizar columnas" title="Configurar columnas visibles">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7m0-18H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7m0-18v18"/>
        </svg>
        <span>Personalizar Columnas</span>
    </button>

    <!-- 
        5. LÓGICA JAVASCRIPT (ES6+)
    -->
    <script>
        /**
         * Componente Autocontenido: Personalizador de Columnas
         * Maneja configuración, renderizado de modal, drag & drop y persistencia.
         */
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- CONSTANTES Y CONFIGURACIÓN ---
            
            // Iconos SVG para las columnas (Inline para portabilidad)
            const ICONS = {
                drag: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
                title: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>`,
                status: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
                priority: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>`,
                type: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`,
                assigned: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
                date: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
                guid: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
                comments: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`
            };

            // Definición Maestra de Columnas
            const ALL_COLUMNS = [
                // Columnas fijas (mandatory: true) no se muestran en el personalizador
                { id: 'checkbox', label: '', mandatory: true },
                { id: 'index', label: '#', mandatory: true },
                // Columnas personalizables
                { id: 'title', label: 'Título', default: true, icon: ICONS.title },
                { id: 'status', label: 'Estado', default: true, icon: ICONS.status },
                { id: 'priority', label: 'Prioridad', default: true, icon: ICONS.priority },
                { id: 'type', label: 'Disciplina', default: true, icon: ICONS.type },
                { id: 'assigned', label: 'Asignado a', default: true, icon: ICONS.assigned },
                { id: 'date', label: 'Fecha', default: true, icon: ICONS.date },
                { id: 'guid', label: 'GUID', default: false, icon: ICONS.guid },
                { id: 'comments', label: 'Comentarios', default: false, icon: ICONS.comments },
                { id: 'actions', label: '', mandatory: true }
            ];

            // Estado local (se carga de localStorage o usa defaults)
            let columnPreferences = [];

            // --- FUNCIONES CORE ---

            /**
             * Carga preferencias guardadas o establece defaults
             */
            function loadPreferences() {
                try {
                    const saved = localStorage.getItem('column_prefs_v1');
                    if (saved) {
                        columnPreferences = JSON.parse(saved);
                        console.log('Preferencias cargadas:', columnPreferences);
                    } else {
                        // Default: Todas las 'default: true' en orden original
                        columnPreferences = ALL_COLUMNS.filter(c => c.default).map(c => c.id);
                    }
                } catch (e) {
                    console.error('Error cargando preferencias:', e);
                    // Fallback a defaults en caso de error
                    columnPreferences = ALL_COLUMNS.filter(c => c.default).map(c => c.id);
                }
            }

            /**
             * Guarda las preferencias actuales
             */
            function savePreferences(newOrderIds) {
                try {
                    localStorage.setItem('column_prefs_v1', JSON.stringify(newOrderIds));
                    columnPreferences = newOrderIds;
                    
                    // Aquí dispararíamos el evento para actualizar la tabla real
                    alert('Preferencias guardadas correctamente.\nColumnas activas: ' + newOrderIds.join(', '));
                    closeModal();
                } catch (e) {
                    console.error('Error guardando preferencias:', e);
                    alert('Error al guardar configuración.');
                }
            }

            /**
             * Genera y muestra el modal de personalización
             */
            function openCustomizerModal() {
                // Prevenir múltiples modales
                if (document.getElementById('column-customizer-modal')) return;

                // Filtrar solo columnas configurables (no obligatorias)
                // El orden en la lista debe reflejar:
                // 1. Las columnas activas en el orden guardado
                // 2. Las columnas inactivas al final (en su orden original de definición)
                
                const activeCols = [];
                const inactiveCols = [];

                // Primero buscar las activas en el orden de preferencias
                columnPreferences.forEach(id => {
                    const col = ALL_COLUMNS.find(c => c.id === id && !c.mandatory);
                    if (col) activeCols.push(col);
                });

                // Luego buscar las que faltan (inactivas)
                ALL_COLUMNS.forEach(col => {
                    if (!col.mandatory && !columnPreferences.includes(col.id)) {
                        inactiveCols.push(col);
                    }
                });

                const displayOrder = [...activeCols, ...inactiveCols];

                // Generar HTML de la lista
                const listItemsHtml = displayOrder.map(col => {
                    const isActive = columnPreferences.includes(col.id);
                    return `
                        <div class="column-item ${isActive ? 'active' : ''}" 
                             data-id="${col.id}" 
                             draggable="true"
                             role="listitem">
                            <div class="column-item-drag-handle" title="Arrastrar para reordenar">
                                ${ICONS.drag}
                            </div>
                            <label class="checkbox-wrapper">
                                <input type="checkbox" ${isActive ? 'checked' : ''} aria-label="Mostrar columna ${col.label}">
                                <span class="checkmark"></span>
                            </label>
                            <div class="column-item-icon">${col.icon || ''}</div>
                            <span class="column-item-label">${col.label}</span>
                        </div>
                    `;
                }).join('');

                // Estructura completa del Modal
                const modalHtml = `
                    <div class="modal-overlay" id="column-customizer-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                        <div class="column-customizer-panel">
                            <div class="column-customizer-header">
                                <h3 id="modal-title">Personalizar Columnas</h3>
                                <button class="btn-close-customizer" aria-label="Cerrar">✕</button>
                            </div>
                            <div class="column-customizer-body">
                                <p class="text-muted text-sm mb-3">
                                    Arrastra los elementos para cambiar el orden. Marca las casillas para mostrar u ocultar columnas.
                                </p>
                                <div class="column-list" id="column-list-container" role="list">
                                    ${listItemsHtml}
                                </div>
                            </div>
                            <div class="column-customizer-footer">
                                <button class="btn btn-ghost" id="btn-reset-columns">Restablecer</button>
                                <button class="btn btn-primary" id="btn-save-columns">Guardar Cambios</button>
                            </div>
                        </div>
                    </div>
                `;

                // Insertar en DOM
                document.body.insertAdjacentHTML('beforeend', modalHtml);

                // Activar animación (pequeño delay para permitir renderizado)
                requestAnimationFrame(() => {
                    const modal = document.getElementById('column-customizer-modal');
                    if(modal) modal.classList.add('active');
                });

                // Configurar eventos del modal
                setupModalEvents();
            }

            /**
             * Cierra el modal con animación
             */
            function closeModal() {
                const modal = document.getElementById('column-customizer-modal');
                if (!modal) return;

                modal.classList.remove('active');
                setTimeout(() => {
                    modal.remove();
                }, 200); // Esperar a que termine la transición CSS
            }

            /**
             * Configura Drag & Drop y Listeners de botones
             */
            function setupModalEvents() {
                const modal = document.getElementById('column-customizer-modal');
                const container = document.getElementById('column-list-container');
                
                // 1. Eventos de Botones
                modal.querySelector('.btn-close-customizer').addEventListener('click', closeModal);
                
                modal.querySelector('#btn-save-columns').addEventListener('click', () => {
                    // Recolectar estado actual
                    const items = container.querySelectorAll('.column-item');
                    const newPrefs = [];
                    items.forEach(item => {
                        const isChecked = item.querySelector('input[type="checkbox"]').checked;
                        if (isChecked) {
                            newPrefs.push(item.dataset.id);
                        }
                    });
                    savePreferences(newPrefs);
                });

                modal.querySelector('#btn-reset-columns').addEventListener('click', () => {
                    if(confirm('¿Restablecer a la configuración predeterminada?')) {
                        localStorage.removeItem('column_prefs_v1');
                        loadPreferences();
                        closeModal();
                        setTimeout(openCustomizerModal, 250); // Reabrir para ver cambios
                    }
                });

                // Cerrar al hacer clic fuera del panel (overlay)
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal();
                });

                // Manejo de checkboxes (visual)
                container.addEventListener('change', (e) => {
                    if (e.target.type === 'checkbox') {
                        const item = e.target.closest('.column-item');
                        if (e.target.checked) {
                            item.classList.add('active');
                        } else {
                            item.classList.remove('active');
                        }
                    }
                });

                // 2. Lógica Drag & Drop (Nativo HTML5)
                let draggedItem = null;

                const items = container.querySelectorAll('.column-item');
                items.forEach(item => {
                    
                    item.addEventListener('dragstart', (e) => {
                        draggedItem = item;
                        setTimeout(() => item.classList.add('dragging'), 0);
                        // Efecto visual de movimiento
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', item.dataset.id); // Requerido por Firefox
                    });

                    item.addEventListener('dragend', () => {
                        item.classList.remove('dragging');
                        draggedItem = null;
                        
                        // Opcional: Auto-check al mover si estaba desactivado?
                        // Por ahora mantenemos comportamiento simple
                    });
                });

                container.addEventListener('dragover', (e) => {
                    e.preventDefault(); // Necesario para permitir drop
                    const afterElement = getDragAfterElement(container, e.clientY);
                    const draggable = document.querySelector('.dragging');
                    
                    if (afterElement == null) {
                        container.appendChild(draggable);
                    } else {
                        container.insertBefore(draggable, afterElement);
                    }
                });
            }

            /**
             * Helper para encontrar la posición de inserción durante el drag
             */
            function getDragAfterElement(container, y) {
                // Seleccionar todos los items excepto el que se está arrastrando
                const draggableElements = [...container.querySelectorAll('.column-item:not(.dragging)')];

                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    // Distancia desde el centro del elemento al cursor
                    const offset = y - box.top - box.height / 2;
                    
                    // Si el offset es negativo (estamos encima del centro) y es el más cercano a 0
                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;
            }

            // --- INICIALIZACIÓN ---
            loadPreferences();
            
            const btn = document.getElementById('btn-open-customizer');
            if(btn) {
                btn.addEventListener('click', openCustomizerModal);
            }
        });
    </script>
</body>
</html>
